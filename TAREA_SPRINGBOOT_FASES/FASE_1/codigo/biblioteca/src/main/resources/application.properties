spring.application.name=biblioteca

# Datos de conexion a la BBDD
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_db
spring.datasource.username=root
spring.datasource.password=root1234

# Con esto evito que el programa cree más entidades en caso de
# No coincidir el nombre de la entidad con una existente
spring.jpa.hibernate.ddl-auto=validate

# Parámetro para mostrar todas las ejecuciones SQL que se hacen
spring.jpa.show-sql=true