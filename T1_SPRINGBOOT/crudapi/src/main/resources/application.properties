spring.application.name=crudapi

# Estos son los parámetros en donde se ponen las credenciales
spring.datasource.url=jdbc:mysql://localhost:3306/tienda
spring.datasource.username=root
spring.datasource.password=root1234

# Nos crea las tablas si no están creadas, pero no las borra.
spring.jpa.hibernate.ddl-auto=update

# Parámetro para mostrar todas las ejecuciones SQL que se hacen
spring.jpa.show-sql=true
